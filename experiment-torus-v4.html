<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05090b">
<title>Experiment — Turquoise Torus v4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090b}
body{position:fixed;inset:0;overscroll-behavior:none;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
#enter{position:fixed;z-index:5;right:16px;bottom:16px;width:44px;height:44px;border:1px solid #b7fff333;border-radius:50%;background:#09181ccc;color:#d6fff2;display:grid;place-items:center;padding:0;cursor:pointer;backdrop-filter:blur(8px)}
#enter svg{width:19px;height:19px}
#hint{position:fixed;left:12px;bottom:12px;color:#b9e8df77;font:11px system-ui,sans-serif;pointer-events:none;max-width:78vw}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<button id="enter" aria-label="Войти в иммерсивный режим"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
<div id="hint"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const hint=document.querySelector('#hint');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05090b);
scene.fog=new THREE.FogExp2(0x071014,.018);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.03,100);
camera.position.set(0,1.62,0);camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x6dbbb7,0x071013,.65));
const floorMat=new THREE.MeshStandardMaterial({color:0x071012,roughness:.42,metalness:.18});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);

function pointLight(color,intensity,pos,dist=7){const l=new THREE.PointLight(color,intensity,dist,1.8);l.position.set(...pos);scene.add(l);return l;}
const lights=[
 pointLight(0x69f2df,24,[.8,2,-1.4],7),
 pointLight(0x82b8a1,14,[-1.4,1.5,-2.1],6),
 pointLight(0x36bfc9,12,[.2,2.7,-3],7),
 pointLight(0xd2b879,5,[1.6,.7,-2.4],5)
];

// A single soft pool of light on the floor. No stacked discs, which caused the visible stripe/dots artifact.
const poolGeo=new THREE.CircleGeometry(1,64);
const poolMat=new THREE.MeshBasicMaterial({color:0x36cfc0,transparent:true,opacity:.08,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const pool=new THREE.Mesh(poolGeo,poolMat);pool.rotation.x=-Math.PI/2;pool.scale.set(1.05,.65,1);pool.position.set(0,.018,-1.85);scene.add(pool);

const anchor=new THREE.Group();scene.add(anchor);
const modelRoot=new THREE.Group();anchor.add(modelRoot);
let mesh=null,geom=null,basePositions=null,spherePositions=null,morph=0,morphTarget=0;
let particles=null,particleVelocities=[],burst=false,burstAge=0,gyroEnabled=false;
let tiltX=0,tiltZ=0,yaw=0,pitch=0,dragging=false,lastX=0,lastY=0;
const keys=new Set();let lastShake=0;
const clock=new THREE.Clock();const loader=new GLTFLoader();

loader.load('./torus.glb',gltf=>{
 const loaded=gltf.scene;modelRoot.add(loaded);loaded.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(loaded),size=new THREE.Vector3();box.getSize(size);
 const center=new THREE.Vector3();box.getCenter(center);
 // Normalize mesh around its own origin, then size it to a stable, visible scale.
 loaded.position.sub(center);
 const maxDim=Math.max(size.x,size.y,size.z);
 if(maxDim>0)loaded.scale.setScalar(1.0/maxDim);
 loaded.updateMatrixWorld(true);
 loaded.traverse(o=>{
  if(o.isMesh&&!mesh){
   mesh=o;geom=o.geometry.clone();o.geometry=geom;
   basePositions=geom.attributes.position.array.slice();
   const attr=geom.attributes.position;spherePositions=new Float32Array(basePositions.length);
   for(let i=0;i<attr.count;i++){
    const x=basePositions[i*3],y=basePositions[i*3+1],z=basePositions[i*3+2];
    const len=Math.max(.00001,Math.hypot(x,y,z));
    spherePositions[i*3]=x/len*.42;spherePositions[i*3+1]=y/len*.42;spherePositions[i*3+2]=z/len*.42;
   }
   if(o.material){
    o.material=o.material.clone();
    if('color'in o.material)o.material.color.set(0x7ce7d9);
    if('roughness'in o.material)o.material.roughness=.23;
    if('metalness'in o.material)o.material.metalness=.24;
    if('emissive'in o.material){o.material.emissive=new THREE.Color(0x0b706b);o.material.emissiveIntensity=.55;}
    if('transparent'in o.material)o.material.transparent=false;
    if('opacity'in o.material)o.material.opacity=1;
   }
  }
 });
 if(mesh){
  // Preserve visibility if the source GLB contains odd transforms or a tiny bounding box.
  mesh.visible=true;
  hint.textContent='';
 }else hint.textContent='В torus.glb не найден объект-меш.';
},undefined,err=>{console.error(err);hint.textContent='Не найден torus.glb. Положи его рядом с HTML-файлом.';});

function createBurst(){
 if(!mesh||burst)return;
 const a=geom.attributes.position,count=Math.min(300,a.count),arr=new Float32Array(count*3);particleVelocities=[];
 mesh.updateWorldMatrix(true,false);
 for(let i=0;i<count;i++){
  const idx=Math.floor(Math.random()*a.count),v=new THREE.Vector3(a.getX(idx),a.getY(idx),a.getZ(idx));mesh.localToWorld(v);
  arr.set([v.x,v.y,v.z],i*3);
  particleVelocities.push(new THREE.Vector3(Math.random()-.5,Math.random()-.1,Math.random()-.5).normalize().multiplyScalar(.45+Math.random()*1.4));
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
 const m=new THREE.PointsMaterial({color:0x80fff0,size:.014,transparent:true,opacity:.92,depthWrite:false,blending:THREE.AdditiveBlending});
 particles=new THREE.Points(g,m);scene.add(particles);mesh.visible=false;burst=true;burstAge=0;
}
function updateBurst(dt){
 if(!burst||!particles)return;
 burstAge+=dt;const a=particles.geometry.attributes.position;
 for(let i=0;i<a.count;i++){const v=particleVelocities[i];a.setXYZ(i,a.getX(i)+v.x*dt,a.getY(i)+v.y*dt,a.getZ(i)+v.z*dt);v.y-=.18*dt;}
 a.needsUpdate=true;particles.material.opacity=Math.max(0,1-burstAge/1.6);
 if(burstAge>2.7){scene.remove(particles);particles.geometry.dispose();particles.material.dispose();particles=null;particleVelocities=[];burst=false;if(mesh)mesh.visible=true;}
}
function updateShape(dt,t){
 if(!mesh||!geom||!basePositions||!spherePositions||burst)return;
 morph+=(morphTarget-morph)*Math.min(1,dt*1.15);
 const a=geom.attributes.position;
 const sx=1+Math.min(2.0,Math.abs(tiltZ)*2.1),sy=1+Math.min(1.8,Math.abs(tiltX)*1.7);
 const shearX=tiltZ*1.25,shearZ=tiltX*1.05;
 const wobble=.014*Math.sin(t*2.1);
 for(let i=0;i<a.count;i++){
  const k=i*3;
  let x=basePositions[k]*(1-morph)+spherePositions[k]*morph;
  let y=basePositions[k+1]*(1-morph)+spherePositions[k+1]*morph;
  let z=basePositions[k+2]*(1-morph)+spherePositions[k+2]*morph;
  const wave=Math.sin(y*7-t*2.4+x*3)*wobble;
  a.array[k]=x*sx+shearX*y+wave;
  a.array[k+1]=y*sy+Math.sin(x*4+t)*Math.abs(tiltZ)*.06;
  a.array[k+2]=z*(1+Math.min(1.6,Math.abs(tiltX)*1.6))+shearZ*x+wave*.5;
 }
 a.needsUpdate=true;geom.computeVertexNormals();
 if(mesh.material&&'roughness'in mesh.material)mesh.material.roughness=.18+.18*morph;
 if(mesh.material&&'emissiveIntensity'in mesh.material)mesh.material.emissiveIntensity=.48+.18*(.5+.5*Math.sin(t*1.2));
}
function orientationHandler(e){
 if(!gyroEnabled||e.beta==null||e.gamma==null)return;
 const d=Math.PI/180;tiltX=THREE.MathUtils.clamp((e.beta-35)*d,-1.0,1.0);tiltZ=THREE.MathUtils.clamp(e.gamma*d,-1.0,1.0);
}
function motionHandler(e){
 if(!gyroEnabled)return;const a=e.accelerationIncludingGravity||e.acceleration;if(!a||a.x==null)return;
 const magnitude=Math.hypot(a.x,a.y,a.z),now=performance.now();
 if(magnitude>18&&now-lastShake>2200){createBurst();lastShake=now;}
}
async function enterImmersive(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')gyroEnabled=(await DeviceOrientationEvent.requestPermission())==='granted';
  else gyroEnabled=typeof DeviceOrientationEvent!=='undefined';
  if(gyroEnabled){window.addEventListener('deviceorientation',orientationHandler,true);
   if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{if((await DeviceMotionEvent.requestPermission())==='granted')window.addEventListener('devicemotion',motionHandler,true);}catch{}}
   else window.addEventListener('devicemotion',motionHandler,true);
  }
  if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false)){
   const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});await renderer.xr.setSession(session);
   document.querySelector('#enter').hidden=true;session.addEventListener('end',()=>document.querySelector('#enter').hidden=false);
  }else{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch{}hint.textContent='';}
 }catch(err){console.warn(err);hint.textContent='Разреши датчики движения и попробуй снова.';}
}
document.querySelector('#enter').addEventListener('click',enterImmersive);

renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging||e.pointerType!=='mouse'||gyroEnabled||renderer.xr.isPresenting)return;yaw-=(e.clientX-lastX)*.003;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.003,-1.35,1.35);camera.rotation.set(pitch,yaw,0,'YXZ');lastX=e.clientX;lastY=e.clientY;});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
window.addEventListener('keydown',e=>keys.add(e.code));window.addEventListener('keyup',e=>keys.delete(e.code));

function animate(t,dt){
 lights.forEach((l,i)=>{l.intensity=[24,14,12,5][i]*(.82+.18*Math.sin(t*.4+i*1.6));l.position.x=[.8,-1.4,.2,1.6][i]+Math.sin(t*.16+i*2)*.25;});
 pool.material.opacity=.055+.025*(.5+.5*Math.sin(t*.6));
 // Approaches the viewer as the loop peaks, then retreats smoothly. Never sinks below floor.
 const phase=(t%11)/11;
 const approach=.5-.5*Math.cos(phase*Math.PI*2);
 const forward=-2.25-approach*1.0+Math.sin(t*.55)*.035;
 const rise=.48+approach*.48+Math.sin(t*.8)*.025;
 if(!burst){anchor.position.set(Math.sin(phase*Math.PI*2)*.08,rise,forward);anchor.rotation.y=Math.sin(phase*Math.PI*2)*.18;anchor.rotation.x=tiltX*.10;anchor.rotation.z=tiltZ*.10;}
 if(mesh&&!burst){
  const activeCam=renderer.xr.isPresenting?renderer.xr.getCamera(camera):camera;
  const cp=new THREE.Vector3();activeCam.getWorldPosition(cp);const op=new THREE.Vector3();anchor.getWorldPosition(op);
  const distance=cp.distanceTo(op);morphTarget=THREE.MathUtils.clamp((1.6-distance)/.85,0,1);
  mesh.rotation.x+=(tiltX*.42-mesh.rotation.x)*Math.min(1,dt*1.5);mesh.rotation.z+=(tiltZ*.42-mesh.rotation.z)*Math.min(1,dt*1.5);
 }
 updateShape(dt,t);updateBurst(dt);
 if(!renderer.xr.isPresenting&&!gyroEnabled){
  const speed=1.1*dt,forwardVec=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys.has('KeyW')||keys.has('ArrowUp'))camera.position.addScaledVector(forwardVec,speed);
  if(keys.has('KeyS')||keys.has('ArrowDown'))camera.position.addScaledVector(forwardVec,-speed);
  if(keys.has('KeyA')||keys.has('ArrowLeft'))camera.position.addScaledVector(right,-speed);
  if(keys.has('KeyD')||keys.has('ArrowRight'))camera.position.addScaledVector(right,speed);
  camera.position.y=1.62;
 }else if(gyroEnabled&&!renderer.xr.isPresenting){
  camera.rotation.set(THREE.MathUtils.clamp(tiltX,-1.1,1.1),yaw,THREE.MathUtils.clamp(tiltZ,-1.1,1.1),'YXZ');
 }
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);animate(clock.elapsedTime,dt);});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
